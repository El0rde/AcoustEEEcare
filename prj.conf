# ══════════════════════════════════════════════════════════════
# AcoustEEEcare v8.1 — BLE-to-MFCC prj.conf (single-threaded)
# ══════════════════════════════════════════════════════════════

CONFIG_GPIO=y

# ── BLE core ──────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# ── MTU / ACL buffers ─────────────────────────────────────────
# 251 = BLE Data Length Extension max PDU. NUS payload = MTU - 3.
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# REQUIRED: bt_gatt_exchange_mtu() lives in the GATT client code, so this
# must be y even though we are a peripheral. Without it the link fails:
#   undefined reference to `bt_gatt_exchange_mtu'
CONFIG_BT_GATT_CLIENT=y

# ── BLE throughput tuning ─────────────────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_PREPARE_COUNT=2

# ── Data Length Extension + 2M PHY ───────────────────────────
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# ── SAADC — nrfx direct (Zephyr ADC driver not used) ─────────
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# ── Logging / debugging ───────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3      
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_THREAD_NAME=y
# Stack diagnostics — keep on during bring-up, can remove for production.
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# ── Stack & heap ──────────────────────────────────────────────
# Main stack bumped to 8192: v8.1 runs the MFCC pipeline (incl. the
# lung 2048-pt FFT) in the main thread. The FFT scratch is static in
# dsp_mfcc.c so stack use is modest, but 8192 leaves comfortable margin.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=2048

# ── Thread priority ───────────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5

# ── FPU — required for CMSIS-DSP float32 ops ──────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── CMSIS-DSP (arm_math.h) ────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y   
CONFIG_CMSIS_DSP_TRANSFORM=y   
                               
CONFIG_CMSIS_DSP_FASTMATH=y   

# ── Ring buffer (still used elsewhere in Zephyr; harmless to keep) ──
CONFIG_RING_BUFFER=y