# =============================================================
# AcoustEEEcare prj.conf — v7.5
# Updated for BSS-corruption fixes + RAM usage instrumentation.
# =============================================================

CONFIG_GPIO=y

# ── BLE core ────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# ── MTU negotiation ────────────────────────────────────────────
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=255
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255

# ── Data Length Extension ──────────────────────────────────────
# nRF52840 hardware max PDU is 251 bytes.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ── SAADC — nrfx direct ────────────────────────────────────────
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# ── Logging ────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# v7.5: DEBUG-MODE TOGGLE.
# IMMEDIATE mode prints logs synchronously from the calling thread,
# which means you see logs RIGHT BEFORE a hang/fault. Slower but
# essential for diagnosing the kind of corruption we just chased.
# Comment out the line below for production deferred-mode logging.
#CONFIG_LOG_MODE_IMMEDIATE=y

# ── Stack & heap ───────────────────────────────────────────────
# Main thread runs record_and_stream() including TFLM inference.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=1536

# v7.5: bumped 16 KB -> 32 KB.
# TFLite Micro does NOT use the kernel heap. Heap is for BLE net_bufs
# and FATFS work areas. With FATFS LFN now in stack mode (see below)
# the heap pressure drops slightly, but BLE streaming the audio.pcm
# + heart_mfcc.f32 + lung_mfcc.f32 + result files can spike net_buf
# usage. 32 KB gives comfortable headroom.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── FPU — required for arm_math.h float32 ops ──────────────────
CONFIG_FPU=y
# Allows BLE workqueue + app thread to share FPU.
CONFIG_FPU_SHARING=y

# ── CMSIS-DSP (arm_math.h) ─────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y

# ── Ring buffer ────────────────────────────────────────────────
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y

# ── BLE throughput tuning ──────────────────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# ── Thread priorities ──────────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5

# ── Stack usage measurement ────────────────────────────────────
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# v7.5: thread analyzer for whole-system stack reports + naming.
# Used by report_ram_usage() to dump all threads (main, idle, BLE
# rx, our three workers). Cheap; keep enabled in production too.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=n
#CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_THREAD_NAME=y

# v7.5: heap runtime stats so report_ram_usage() can print free/max
# kernel-heap usage. Tiny overhead.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# v7.5: CATCH BSS / STACK OVERFLOWS AT THE MOMENT THEY HAPPEN.
# HW_STACK_PROTECTION uses the nRF52840's MPU to put a guard region
# at the bottom of each thread stack — overflow triggers an immediate
# MemManage fault with a clear panic message naming the thread.
# (Don't enable STACK_SENTINEL alongside this — it's the software
#  fallback for boards without an MPU and Zephyr Kconfig won't let
#  you have both at once.)
CONFIG_HW_STACK_PROTECTION=y

# Assertions on. ASSERT_LEVEL=2 is the standard "halt on failed
# assertion" level; level 1 would only log and continue.
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# ── SD card / FAT filesystem ───────────────────────────────────
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_TYPES=2
CONFIG_FS_FATFS_LFN=y

# v7.5: switched from BSS-mode to STACK-mode LFN buffers.
# BSS mode keeps one shared ~600 B buffer that is NOT reentrant —
# two threads doing fs_open/fs_stat at once would corrupt each
# other's path resolution. Stack mode allocates the buffer on
# each caller's stack (~134 B per call). Our SD writer thread
# stack and main stack both have plenty of room.
# CONFIG_FS_FATFS_LFN_MODE_BSS=y   ← DO NOT USE
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=64

# v7.4: do NOT auto-format on mount failure.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Uncomment if your card is exFAT-formatted (Windows default >32 GB):
# CONFIG_FS_FATFS_EXFAT=y

# ── C++ support (required by TFLite Micro) ─────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

# ── TFLite Micro ───────────────────────────────────────────────
CONFIG_TENSORFLOW_LITE_MICRO=y

# CMSIS-NN kernels: ~5-15× speedup on int8 CONV_2D/FULLY_CONNECTED.
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
# UDC (USB Device Controller) net_buf pool
# Default 1024 is too small for Windows hosts and causes
# "Failed to allocate net_buf 4095, ep 0x80" at enumeration.
CONFIG_UDC_BUF_POOL_SIZE=1200
