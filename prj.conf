# ============================================================
# AcoustEEEcare — SD Card Isolated Test
# prj.conf
#
# Logging approach copied directly from your working project:
# UART_CONSOLE=y with no USB stack. The XIAO nRF52840 Sense has
# an onboard CMSIS-DAP chip that bridges USB to UART automatically,
# so the serial monitor just works without any USB driver config.
# ============================================================

# --- Logging (matches your working project exactly) ---
CONFIG_LOG=y
# 0=OFF 1=ERR 2=WRN 3=INF 4=DBG
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y

# --- GPIO & SPI ---
CONFIG_GPIO=y
CONFIG_SPI=y

# --- Disk / FAT (matches your working project) ---
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_TYPES=2
# Do NOT auto-format — fail loudly if card is blank or wrong FS
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Uncomment if your card is exFAT-formatted (Windows default >32 GB):
# CONFIG_FS_FATFS_EXFAT=y

# --- Stack & heap (matches your working project) ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192