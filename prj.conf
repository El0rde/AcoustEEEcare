# =============================================================
# AcoustEEEcare prj.conf — v7.3
# Updated for best_mcu_int8 heart model (665×25 int8) integration
# =============================================================

CONFIG_GPIO=y

# ── BLE core ────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# ── MTU negotiation ────────────────────────────────────────────
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=255
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255

# ── Data Length Extension ──────────────────────────────────────
# nRF52840 hardware max PDU is 251 bytes.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ── SAADC — nrfx direct ────────────────────────────────────────
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# ── Logging ────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# ── Stack & heap ───────────────────────────────────────────────
# Main thread runs record_and_stream() including TFLM inference.
# 8 KB is generous; can trim to 6 KB if RAM gets tight again.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=1536

# v7.3: heap dropped 32 KB -> 16 KB.
# TFLite Micro itself does NOT use the kernel heap — it lives entirely
# in tensor_arena.  The heap is consumed mainly by BLE net_bufs and
# FATFS work areas.  16 KB is plenty for those.  If you see -ENOMEM
# from bt_nus_send or fs_mount under load, bump this back up.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# ── FPU — required for arm_math.h float32 ops ──────────────────
CONFIG_FPU=y
# Allows BLE workqueue + app thread to share FPU.
CONFIG_FPU_SHARING=y

# ── CMSIS-DSP (arm_math.h) ─────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_FASTMATH=y

# ── Ring buffer ────────────────────────────────────────────────
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y

# ── BLE throughput tuning ──────────────────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y

# ── Thread priorities ──────────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5

# ── Stack usage measurement ────────────────────────────────────
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# ── SD card / FAT filesystem ───────────────────────────────────
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_TYPES=2
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_LFN=64

# ── C++ support (required by TFLite Micro) ─────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

# ── TFLite Micro ───────────────────────────────────────────────
CONFIG_TENSORFLOW_LITE_MICRO=y

# v7.3: CMSIS-NN kernels ENABLED.
# This is a ~5-15× speedup on int8 CONV_2D/FULLY_CONNECTED for
# the Cortex-M4F.  The heart model has 6 Conv2D + 3 FC layers,
# so the inference time benefit is large.  Small additional
# RAM cost (im2col scratch) is included in our 100 KB arena budget.
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y