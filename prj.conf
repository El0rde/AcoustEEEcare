CONFIG_GPIO=y

# BLE core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# MTU negotiation
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=512
CONFIG_BT_BUF_ACL_TX_SIZE=512
CONFIG_BT_BUF_ACL_RX_SIZE=512

# Data Length Extension
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# SAADC — nrfx direct
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Stack & heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=1536
# reduced — dsp_mfcc.c uses no heap
CONFIG_HEAP_MEM_POOL_SIZE=8192   

# FPU — required for arm_math.h float32 ops
CONFIG_FPU=y
# allows BLE workqueue + app thread to share FPU
CONFIG_FPU_SHARING=y             

# ── CMSIS-DSP (arm_math.h) ─────────────────────────────────────────
# Enables arm_biquad_cascade_df2T_f32, arm_rfft_fast_f32, etc.
CONFIG_CMSIS_DSP=y
 # biquad cascade
CONFIG_CMSIS_DSP_FILTERING=y
 # RFFT    
CONFIG_CMSIS_DSP_TRANSFORM=y   
# arm_cos_f32, arm_sin_f32, arm_sqrt_f32 
CONFIG_CMSIS_DSP_FASTMATH=y      

# ── Ring buffer (audio capture, v6.0 Layer A) ──────────────────────
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y

# ── BLE throughput tuning (v6.0 Layer B) ──────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# ── Thread priorities (v5.9) ───────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5