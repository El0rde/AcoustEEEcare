# ══════════════════════════════════════════════════════════════
# AcoustEEEcare v7.2 — BLE-only prj.conf
# SD card configs removed; duplicates resolved.
# ══════════════════════════════════════════════════════════════

CONFIG_GPIO=y

# ── BLE core ──────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# ── MTU / ACL buffers ─────────────────────────────────────────
# ACL TX size set to 251 to match BLE DLE max PDU.
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# ── BLE throughput tuning ─────────────────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_PREPARE_COUNT=2

# ── Data Length Extension + 2M PHY ───────────────────────────
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# ── SAADC — nrfx direct (Zephyr ADC driver not used) ─────────
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# ── Logging ───────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# ── Stack & heap ──────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=1536
# dsp_mfcc.c uses static buffers only — heap can stay modest
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ── Thread priority ───────────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5

# ── FPU — required for arm_math.h float32 ops ─────────────────
CONFIG_FPU=y
# Allows BLE workqueue + app thread to share the FPU context
CONFIG_FPU_SHARING=y

# ── CMSIS-DSP (arm_math.h) ────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y    # arm_biquad_cascade_df2T_f32
CONFIG_CMSIS_DSP_TRANSFORM=y    # arm_rfft_fast_f32
CONFIG_CMSIS_DSP_FASTMATH=y     # arm_cos/sin/sqrt_f32
# Required for 2048-point RFFT used by the lung pipeline.
# Without this, arm_rfft_fast_init_f32(fft_size=2048) returns
# ARM_MATH_ARGUMENT_ERROR at runtime even if TRANSFORM=y.
CONFIG_CMSIS_DSP_TRANSFORM_RFFT_FAST_F32=y

# ── Ring buffer ───────────────────────────────────────────────
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y