# ══════════════════════════════════════════════════════════════
# AcoustEEEcare v8.4 — BLE + one-capture DUAL inference
# (single-threaded; no SD card / no FATFS)
# ══════════════════════════════════════════════════════════════

CONFIG_GPIO=y

# ── BLE core ──────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="AcoustEEEcare"

# ── MTU / ACL buffers ─────────────────────────────────────────
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# Required: bt_gatt_exchange_mtu() lives in the GATT client code.
CONFIG_BT_GATT_CLIENT=y

# ── BLE throughput tuning ─────────────────────────────────────
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_PREPARE_COUNT=2

# ── Data Length Extension + 2M PHY ───────────────────────────
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y

# ── SAADC — nrfx direct ───────────────────────────────────────
CONFIG_NRFX_SAADC=y
CONFIG_ADC=n

# ── Logging / debugging ───────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3      
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
# HW stack protection via MPU (preferred over STACK_SENTINEL on nRF52840).
CONFIG_HW_STACK_PROTECTION=y

# ── Stack & heap ──────────────────────────────────────────────
# Main thread runs capture + MFCC + TFLM Invoke.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=1536
# TFLM uses the static tensor_arena (in BSS), not the kernel heap;
# heap is only for BLE net_bufs.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ── Thread priority ───────────────────────────────────────────
CONFIG_MAIN_THREAD_PRIORITY=5

# ── FPU — required for CMSIS-DSP + TFLM float ops ─────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── CMSIS-DSP (arm_math.h) ────────────────────────────────────
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y   
CONFIG_CMSIS_DSP_TRANSFORM=y   
CONFIG_CMSIS_DSP_FASTMATH=y    

# ── Ring buffer ───────────────────────────────────────────────
CONFIG_RING_BUFFER=y

# ── C++ (required by TFLite Micro) ────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y

# ── TFLite Micro ──────────────────────────────────────────────
CONFIG_TENSORFLOW_LITE_MICRO=y
# CMSIS-NN kernels: large speedup on int8 CONV_2D / FULLY_CONNECTED.
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Assertions on (catch TFLM / kernel misuse early during bring-up).
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2